spring:
  datasource:
    url: jdbc:tc:postgresql:16:///fieldops_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    # O driver do Testcontainers ignora estas credenciais; ficam só para o binding do Spring.
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

fieldops:
  seed:
    enabled: false
  jwt:
    # Valor fixo e explicitamente inutilizável fora dos testes: eles precisam ser
    # determinísticos e rodar em CI sem segredo de ambiente.
    secret: "test-only-signing-key-never-used-by-any-real-deployment-0123456789"
    access-token-ttl-minutes: 30
    refresh-token-ttl-minutes: 1440
  storage:
    evidence-dir: ./data/evidence-test
