fieldops:
  seed:
    enabled: true
    # Sem valor padrão: sem esta variável o seed não roda, e nenhuma conta de
    # administrador com senha conhecida chega a existir.
    password: ${FIELDOPS_SEED_PASSWORD:}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId}]"
  level:
    com.fieldops: DEBUG
