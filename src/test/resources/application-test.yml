spring:
  datasource:
    url: jdbc:tc:postgresql:16:///fieldops_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    # O driver do Testcontainers ignora estas credenciais; ficam só para o binding do Spring.
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

fieldops:
  seed:
    enabled: false
  jwt:
    # Valor fixo e explicitamente inutilizável fora dos testes: eles precisam ser
    # determinísticos e rodar em CI sem segredo de ambiente.
    secret: "test-only-signing-key-never-used-by-any-real-deployment-0123456789"
    access-token-ttl-minutes: 30
    refresh-token-ttl-minutes: 1440
  storage:
    mode: local
    evidence-dir: ./data/evidence-test
  security:
    cors:
      allowed-origins: http://localhost:4200
  mail:
    provider: noop
    from: no-reply@test.fieldops.local
    password-reset-url: http://localhost:4200/reset-password
    region: us-east-1

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation: INFO
