spring:
  datasource:
    url: ${FIELDOPS_E2E_DB_URL:jdbc:postgresql://127.0.0.1:55433/fieldops_e2e}
    username: ${FIELDOPS_E2E_DB_USER:fieldops_e2e}
    password: ${FIELDOPS_E2E_DB_PASSWORD:fieldops_e2e_local_only}
  jpa:
    hibernate:
      ddl-auto: validate

server:
  address: 127.0.0.1
  port: ${FIELDOPS_E2E_API_PORT:8080}

fieldops:
  seed:
    enabled: true
    password: ${FIELDOPS_E2E_SEED_PASSWORD:FieldOps-E2E-Local-Only-2026!}
  security:
    cors:
      allowed-origins: ${FIELDOPS_E2E_CORS_ORIGIN:http://localhost:4200}
  jwt:
    secret: ${FIELDOPS_E2E_JWT_SECRET:fieldops-e2e-local-secret-change-me-01234567890123456789012345678901234567890123456789}
  storage:
    mode: local
    evidence-dir: ${FIELDOPS_E2E_EVIDENCE_DIR:./target/e2e-evidence}
  mail:
    provider: noop
    password-reset-url: ${FIELDOPS_E2E_PASSWORD_RESET_URL:http://localhost:4200/reset-password}

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,e2eSeed

logging:
  level:
    com.fieldops: INFO
