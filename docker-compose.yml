services:
  postgres:
    image: postgres:16
    container_name: fieldops-postgres
    environment:
      POSTGRES_DB: fieldops
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: fieldops_dev_pw
    ports:
      - "5433:5432"
    volumes:
      - fieldops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldops -d fieldops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fieldops_pgdata:
