spring:
  application:
    name: fieldops-api
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5433/fieldops
    username: fieldops
    password: ${FIELDOPS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

server:
  port: 8080
  error:
    include-message: always

fieldops:
  jwt:
    secret: ${FIELDOPS_JWT_SECRET}
    access-token-ttl-minutes: 30
    refresh-token-ttl-minutes: 1440
  storage:
    mode: ${FIELDOPS_STORAGE_MODE:local}
    evidence-dir: ./data/evidence
    bucket: ${FIELDOPS_STORAGE_BUCKET:}
    region: ${AWS_REGION:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
