name: API CI

on:
  pull_request:
    paths:
      - '**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - '**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and package
        run: mvn -B clean verify

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: fieldops-api-${{ github.sha }}
          path: target/fieldops-api-*.jar
          if-no-files-found: error

  image:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag fieldops-api:${{ github.sha }} .
